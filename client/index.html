<style>
  :root { --display: 'Cormorant Garamond', 'Iowan Old Style', Palatino, Georgia, serif; --body: 'Alegreya Sans', 'Gill Sans', ui-sans-serif, sans-serif; --gold: #e2c27a; --paper: #f2e9d8; --ink: #1e1c1a; --muted: #6b6459; --line: #d9cdb5; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template: auto 1fr auto / 1fr; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--body); }

  main { position: relative; min-height: 0; grid-row: 2; grid-column: 1; --panel: 380px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* the panel floats over a full-width picture; the picture centres itself in the space left of it (--panel) */
  aside { grid-row: 2; grid-column: 1; justify-self: end; align-self: stretch; z-index: 3; width: 360px; margin: 10px; min-height: 0; overflow-y: auto; padding: 8px 12px; background: #f2e9d8e6; backdrop-filter: blur(6px); border-radius: 4px; box-shadow: 0 6px 24px #1e1c1a40, 0 0 0 1px #b9a98880; }
  #endcard .ec-turn b:first-child { color: #d9b45a; }
  /* ---- holo cards: the generals, everywhere. Pointer (or an idle drift) moves the foil, glitter and glare. */
  @property --mx { syntax: '<percentage>'; inherits: true; initial-value: 50%; }
  @property --my { syntax: '<percentage>'; inherits: true; initial-value: 50%; }
  @property --rx { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
  @property --ry { syntax: '<angle>'; inherits: true; initial-value: 0deg; }

  .holo { position: relative; perspective: 900px; outline: none; color: #f2e9d8; }
  .holo .ho-in { position: relative; isolation: isolate; overflow: hidden; border-radius: 12px; padding: 11px 11px 12px;
    background: radial-gradient(130% 70% at 50% 0%, color-mix(in srgb, var(--c) 42%, #2b1e11), #120c07 72%);
    box-shadow: inset 0 0 0 1px var(--gold), inset 0 0 0 4px #160f09, inset 0 0 0 5px color-mix(in srgb, var(--c) 70%, var(--gold)), 0 14px 30px #0009;
    transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .7s cubic-bezier(.2,.9,.3,1), box-shadow .35s; will-change: transform; }
  .holo.on .ho-in { transition: transform .06s linear, box-shadow .35s; }
  .holo .ho-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }

  .holo .ho-emb::after { content: ''; position: absolute; inset: 4px; background: var(--c); -webkit-mask: var(--m) center/contain no-repeat; mask: var(--m) center/contain no-repeat; }
  .holo .ho-art { margin: 8px 0 7px; height: 118px; border-radius: 4px; overflow: hidden; background: #0005; box-shadow: inset 0 0 0 1px #e2c27a99, 0 0 0 2px #160f09; }
  .holo .ho-art img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }
  .holo .ho-who { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .holo .ho-stats { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 7px; }
  .holo .ho-stats span { font-size: 11px; padding: 1px 6px 1px 4px; border-radius: 10px; background: #f2e9d814; box-shadow: inset 0 0 0 1px #e2c27a55; color: #e8dcc4; }
  .holo .ho-stats b { display: inline-block; min-width: 14px; margin-right: 3px; text-align: center; border-radius: 8px; background: var(--c); color: #fff; font-weight: 700; }
  .holo .ho-line { display: block; font: italic 12.5px/1.35 var(--body); color: #d8cab0; quotes: '“' '”'; }
  .ho-foil, .ho-glit, .ho-glare { position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: inherit; }
  .ho-foil { mix-blend-mode: color-dodge; opacity: calc(.12 + var(--o) * .62); filter: brightness(.8) saturate(1.3);
    background: repeating-linear-gradient(112deg, #ff6b6b00 0%, #ff9f5aaa 3.5%, #f6e46baa 7%, #6cf3a5aa 10.5%, #59c6ffaa 14%, #b27dffaa 17.5%, #ff6b6b00 21%),
      repeating-linear-gradient(22deg, #0000 0 6px, #ffffff10 6px 7px);
    background-size: 360% 360%, auto; background-position: calc(var(--mx) * 1.4) calc(var(--my) * 1.4), 0 0; }
  .ho-glit { mix-blend-mode: color-dodge; opacity: calc(var(--o) * .95);
    background: radial-gradient(circle, #fff 0 .7px, #0000 1.6px) calc(var(--mx) * .25) calc(var(--my) * .25) / 23px 29px,
      radial-gradient(circle, #ffe9a8 0 .6px, #0000 1.4px) calc(var(--mx) * -.35) calc(var(--my) * -.3) / 37px 31px;
    -webkit-mask: radial-gradient(circle at var(--mx) var(--my), #000, #0000 65%); mask: radial-gradient(circle at var(--mx) var(--my), #000, #0000 65%); }
  .ho-glare { mix-blend-mode: overlay; opacity: var(--o); background: radial-gradient(farthest-corner circle at var(--mx) var(--my), #fffc 0%, #fff4 16%, #0000 38%, #0007 100%); }
  @keyframes holoIdle { 0%, 100% { --mx: 22%; --my: 18%; --rx: 4deg; --ry: -7deg; --o: .32; } 50% { --mx: 78%; --my: 82%; --rx: -4deg; --ry: 7deg; --o: .58; } }
  .holo.big { width: clamp(138px, 15vw, 192px); transition: transform .5s cubic-bezier(.2,.9,.3,1), opacity .4s, filter .4s; }

  .holo.big:nth-child(2) .ho-in { animation-delay: -2s; } .holo.big:nth-child(3) .ho-in { animation-delay: -4s; } .holo.big:nth-child(4) .ho-in { animation-delay: -6s; }
  .holo.big:hover, .holo.lit, .holo.now { transform: translateY(-10px); }
  .holo.lit .ho-in, .holo.now .ho-in, .holo.big:hover .ho-in { box-shadow: inset 0 0 0 1px var(--gold), inset 0 0 0 4px #160f09, inset 0 0 0 5px var(--c), 0 0 0 2px color-mix(in srgb, var(--c) 80%, var(--gold)), 0 0 38px color-mix(in srgb, var(--c) 65%, transparent), 0 18px 36px #000b; }
  /* the side panel's cards: a compact row each, same materials */
  .holo.mini { margin: 0 0 8px; cursor: default; }
  .holo.mini .ho-in { display: grid; grid-template-columns: 52px 1fr; grid-template-areas: 'art top' 'art who' 'art stats'; column-gap: 10px; align-items: center; padding: 8px 10px 8px 8px; border-radius: 9px; }
  .holo.mini .ho-art { grid-area: art; margin: 0; height: 66px; } .holo.mini .ho-top { grid-area: top; } .holo.mini .ho-who { grid-area: who; font-size: 10px; } .holo.mini .ho-stats { grid-area: stats; margin: 3px 0 0; } .holo.mini .ho-line { display: none; }
  .holo.mini .ho-name { font-size: 1.12em; } .holo.mini .ho-emb { width: 22px; height: 22px; }
  .holo.mini:has(.why.on, .pact:not([hidden])) .ho-in { padding-bottom: 26px; }
  /* the general just acted: a foil sweep across its card */

  @keyframes actFoil { 0% { --o: 1; --mx: 0%; --my: 0%; } 100% { --o: 0; --mx: 100%; --my: 100%; } }
  .house.act.big .ho-in, .house.act:is(.big) .ho-in { animation-duration: 1.8s; }
  .house.act { animation: act 1.4s ease-out; border-radius: 9px; }

  .house .why { position: absolute; left: 70px; bottom: 6px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; background: var(--c); color: #fff; padding: 1px 7px; border-radius: 3px; opacity: 0; transition: opacity .3s; z-index: 4; } .house .why.on { opacity: 1; }
  .house .pact { position: absolute; right: 10px; bottom: 6px; font-size: 10.5px; background: #4e7a5a55; border: 1px solid #7fb08c99; color: #cfe8d5; padding: 0 7px; border-radius: 3px; z-index: 4; } .house .pact b { filter: brightness(1.6); }

  #narrator { position: absolute; left: 50%; right: auto; bottom: 26px; transform: translateX(calc(-50% - var(--panel) / 2)); z-index: 4; width: min(640px, calc(100% - var(--panel) - 60px)); pointer-events: none; opacity: 0; transition: opacity .35s, transform .35s; }
  #narrator.on { opacity: 1; }
  #narrator .nr-line { background: #f2e9d8f2; border-radius: 6px; padding: 12px 18px 12px 20px; box-shadow: 0 10px 30px #0004, inset 0 0 0 1px #00000014; font-size: 15px; line-height: 1.45; position: relative; animation: nrIn .4s ease-out; }
  #narrator .nr-line::before { content: ''; position: absolute; left: 8px; top: 14px; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
  #narrator .mono { font-family: ui-monospace, Menlo, monospace; font-size: .9em; background: #2a201610; padding: 1px 4px; border-radius: 3px; }
  @keyframes nrIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  #opening { position: absolute; inset: 0; right: var(--panel); display: grid; place-content: center; gap: 22px; background: radial-gradient(ellipse 60% 55% at center, #0b0805e6, #0b0805a8 80%); color: #f2e9d8; z-index: 5; transition: opacity .4s; text-align: center; } #opening .op-title small { color: var(--gold) !important; }
  #opening.out { opacity: 0; } #opening[hidden] { display: none; }
  #opening .op-title small { display: block; letter-spacing: .3em; text-transform: uppercase; font-size: 13px; color: var(--muted); } #opening .op-title b { font-family: var(--display); font-size: 2.6em; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
  #opening .op-cards { display: flex; gap: 18px; justify-content: center; padding-top: 12px; } #opening .holo:not(.now) { opacity: .55; filter: saturate(.6); }
  #opening .op-skip { justify-self: center; color: #f2e9d8; border-color: #e2c27a88; background: #0006; padding: 6px 18px; letter-spacing: .08em; } #opening .op-skip:hover { background: #e2c27a22; }
  @media (max-width: 820px) { #opening .op-cards { display: grid; grid-template-columns: repeat(2, auto); } #opening { right: 0; } }
  dialog#ladder { width: min(760px, 94vw); max-height: 88vh; border: 0; border-radius: 6px; padding: 22px 26px; background: #f2e9d8 url(art/paper-grain.webp); color: var(--ink); box-shadow: 0 20px 60px #0007; }
  dialog#ladder::backdrop { background: #1c140c88; backdrop-filter: blur(2px); }
  #ladder h2 { margin: 0 0 6px; font-size: 1.5em; letter-spacing: .04em; } #ladder h3 { margin: 18px 0 6px; font-size: 1.05em; border-bottom: 1px solid var(--line); padding-bottom: 4px; } #ladder h4 { margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  #ladder .lede { margin: 0 0 12px; line-height: 1.45; } #ladder .muted { color: var(--muted); }
  #ladder .close { position: absolute; right: 14px; top: 12px; } #ladder .close button { border: 0; font-size: 1.2em; }
  #ladder .houses { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border: 0; padding: 0; margin: 0 0 10px; }
  #ladder .houses label { display: flex; gap: 8px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 13px; line-height: 1.2; }
  #ladder .houses label:has(input:checked) { border-color: var(--c); box-shadow: inset 0 0 0 2px var(--c); background: #fff6; }
  #ladder .houses input { position: absolute; opacity: 0; } #ladder .houses img { width: 30px; height: 44px; object-fit: cover; border-radius: 3px; }
  #ladder .houses label:has(input:focus-visible) { outline: 2px solid var(--ink); }
  #ladder textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border: 1px solid #b9a988; border-radius: 3px; background: #fffaf0; resize: vertical; }
  #ladder .row { display: flex; gap: 10px; align-items: center; margin-top: 8px; } #ladder .row input { flex: 1; font: inherit; padding: 4px 8px; border: 1px solid #b9a988; border-radius: 3px; background: #fffaf0; }

  /* ---- ink-and-gold frame around the battlefield, the same identity as the title screen */

<body>
<header>
  <h1>HARKARA</h1>
  <select id="battle" aria-label="Battle"></select>
  <span role="group" aria-label="View" id="views"></span>
  <button id="play" aria-pressed="false">Pause</button>
  <span role="group" aria-label="Speed" id="speeds"></span>
  <span id="clock">Watch 1/30</span>
  <span>Belief view:</span><span role="group" aria-label="Belief view" id="beliefs"></span>

</header>
<main id="stage"><canvas id="c"></canvas><span id="belief-err"></span></main>
<aside><div id="houses"></div><div id="predict" class="item"></div><div role="group" aria-label="Panel" id="tabs"></div><div id="feed" aria-live="off"></div><div id="mail" hidden></div></aside>
<footer>
  <div class="row"><button id="prev" title="Previous mark" aria-label="Previous mark">◀</button><div class="track"><div id="marks"></div><input id="scrub" type="range" min="0" value="0" aria-label="Timeline" /></div><button id="next" title="Next big moment" aria-label="Next big moment">▶</button><button id="copy">Copy link to this moment</button></div>
  <div class="legend">Marks: <b style="color:#c0392b">interception</b> · <b style="color:#8fa6ff">readable decode</b> · <b style="color:#4e7a5a">truce</b> · <b style="color:#888">rout</b>. Belief view: ghosts show where a general thinks units are. Click a rider to ride with it.</div>
</footer>
<script type="module" src="./main.ts"></script>
</body>
</html>

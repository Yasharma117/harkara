<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harkara · grey box</title>
<style>
  :root { --paper: #f2e9d8; --ink: #1e1c1a; --muted: #6b6459; --line: #d9cdb5; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template: auto 1fr auto / 1fr; background: var(--paper); color: var(--ink); font: 13px/1.45 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; }
  header { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 1.3em; margin: 0 8px 0 0; letter-spacing: .14em; font-weight: 600; }
  button, select { font: inherit; background: transparent; border: 1px solid #b9a988; border-radius: 3px; padding: 4px 10px; cursor: pointer; color: var(--ink); }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #clock { font-variant-numeric: tabular-nums; min-width: 110px; font-weight: 600; }
  #belief-err { position: absolute; top: 12px; left: 12px; z-index: 2; background: #fff8ecd9; border-radius: 6px; padding: 4px 10px; color: var(--ink); pointer-events: none; }
  #belief-err:empty { display: none; }
  main { position: relative; min-height: 0; grid-row: 2; grid-column: 1; --panel: 380px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* the panel floats over a full-width picture; the picture centres itself in the space left of it (--panel) */
  aside { grid-row: 2; grid-column: 1; justify-self: end; align-self: stretch; z-index: 3; width: 360px; margin: 10px; min-height: 0; overflow-y: auto; padding: 8px 12px; background: #f2e9d8e6; backdrop-filter: blur(6px); border-radius: 4px; box-shadow: 0 6px 24px #1e1c1a40, 0 0 0 1px #b9a98880; }
  .house { display: flex; gap: 10px; align-items: center; margin: 4px 0 6px; padding: 6px 8px; border-radius: 6px; position: relative; overflow: hidden; isolation: isolate; cursor: default; transition: background .25s, box-shadow .25s, transform .25s; }
  /* a gold-leaf shimmer sweeps across every card now and then, staggered */
  .house::after { content: ''; position: absolute; inset: -40% auto -40% -60%; width: 45%; background: linear-gradient(100deg, transparent, #f7e2a055 45%, #fff6d899 50%, #f7e2a055 55%, transparent); transform: skewX(-18deg) translateX(-120%); animation: shimmer 7s ease-in-out infinite; pointer-events: none; z-index: 2; }
  .house:nth-child(2)::after { animation-delay: 1.75s } .house:nth-child(3)::after { animation-delay: 3.5s } .house:nth-child(4)::after { animation-delay: 5.25s }
  @keyframes shimmer { 0%, 70% { transform: skewX(-18deg) translateX(-120%); } 85%, 100% { transform: skewX(-18deg) translateX(420%); } }
  .house:hover, .house:focus-visible { background: color-mix(in srgb, var(--c) 10%, #fffaf0); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent), 0 6px 22px color-mix(in srgb, var(--c) 30%, transparent); transform: translateX(-2px); outline: none; }
  .house:hover::after { animation-duration: 1.4s; }
  .house:hover .portrait { box-shadow: 0 0 0 2px var(--c), 0 0 16px color-mix(in srgb, var(--c) 60%, transparent); }
  /* the general just acted */
  .house.act { animation: act 1.4s ease-out; } .house.act.big { animation: actBig 1.4s ease-out; }
  @keyframes act { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 70%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
  @keyframes actBig { 0% { background: color-mix(in srgb, var(--c) 22%, #fffaf0); box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 80%, transparent), 0 0 30px color-mix(in srgb, var(--c) 50%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
  .house .portrait { transition: box-shadow .25s; }
  @media (prefers-reduced-motion: reduce) { .house::after, .house.act, .house.act.big { animation: none; } }
  .house i { color: var(--muted); }
  .hname { display: flex; gap: 6px; align-items: center; }
  .portrait { width: 40px; height: 60px; object-fit: cover; border-radius: 4px; flex: none; box-shadow: 0 0 0 1px var(--line); }
  .emb { width: 22px; height: 16px; flex: none; background: var(--c); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  .seal { float: right; width: 30px; margin: 0 0 4px 6px; }
  body { background-size: 512px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .item { padding: 6px 4px 7px 20px; margin: 0; border-bottom: 1px solid #d9cdb5; position: relative; }
  .item::before { content: ''; position: absolute; left: 6px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--c, #999); }
  .item small { color: var(--muted); }
  .item.big { background: #f8f0dfcc; }
  .mono { font-family: ui-monospace, Menlo, monospace; letter-spacing: .04em; }
  @media (max-width: 820px) { aside { width: auto; justify-self: stretch; align-self: end; max-height: 42%; } main { --panel: 0px; } }
  footer { position: relative; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
  .row { display: flex; gap: 8px; align-items: center; }
  .track { flex: 1; }
  #prev, #next { font-size: 1.3em; line-height: 1; padding: 4px 9px; }
  #scrub { width: 100%; }
  #tabs { margin: 8px 0 4px; display: flex; gap: 6px; }
  .card { cursor: pointer; }
  #predict button { margin: 4px 4px 0 0; }
  .card button { margin-top: 6px; font-size: .8em; padding: 2px 8px; }
  .card[aria-current="true"] { box-shadow: 0 0 0 2px var(--ink); }
  .fate { font-weight: 600; text-transform: uppercase; font-size: .8em; letter-spacing: .06em; }
  #marks { position: relative; height: 10px; margin: 0 7px; }
  #marks i { position: absolute; top: 0; width: 3px; height: 10px; border-radius: 1px; cursor: pointer; }
  .legend { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .push { margin-left: auto; }
  #title { position: absolute; inset: 0; right: var(--panel); z-index: 7; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #120d08aa, #0b0805f2 75%); color: #f2e9d8; transition: opacity .5s; }
  #title.out { opacity: 0; pointer-events: none; }
  #title .tt-in, #title .tt-rules { max-width: 620px; padding: 0 28px; text-align: center; animation: pmIn 1.2s ease-out both; }
  #title .tt-deva { font-size: 30px; color: #d9b45a; letter-spacing: .1em; font-family: 'Kohinoor Devanagari', 'Devanagari Sangam MN', serif; opacity: .9; }
  #title h1 { font-size: clamp(48px, 7vw, 86px); letter-spacing: .22em; margin: 4px 0 14px; font-weight: 600; background: linear-gradient(180deg, #fff4d4 10%, #d9b45a 55%, #9a7330); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 40px #d9b45a33; }
  #title p { line-height: 1.6; color: #e8dcc4; margin: 0 0 26px; }
  #title .tt-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
  #title button { color: #f2e9d8; border: 1px solid #d9b45a88; background: #00000040; padding: 9px 18px; letter-spacing: .06em; border-radius: 2px; transition: background .2s, box-shadow .2s, transform .2s; }
  #title button:hover, #title button:focus-visible { background: #d9b45a22; box-shadow: 0 0 0 1px #d9b45a, 0 0 24px #d9b45a44; transform: translateY(-1px); outline: none; }
  #title .tt-go { background: #d9b45a; color: #1a130b; border-color: #d9b45a; font-weight: 600; } #title .tt-go:hover { background: #ecc86c; }
  #title small { color: #b9aa8c; font-size: 13px; } #title small b { font-weight: 600; }
  #title .tt-rules { text-align: left; } #title .tt-rules h2 { text-align: center; color: #d9b45a; letter-spacing: .1em; } #title .tt-rules li { margin: 0 0 10px; line-height: 1.5; color: #e8dcc4; } #title .tt-rules b { color: #fff3d6; } #title .tt-rules button { display: block; margin: 18px auto 0; }
  #title [hidden] { display: none; }
  @media (max-width: 820px) { #title { right: 0; } }
  #premise { position: absolute; inset: 0; right: var(--panel); z-index: 6; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 45%, #1d1710ee, #0c0906f6); color: #f2e9d8; cursor: pointer; transition: opacity .45s; }
  #premise[hidden] { display: none; } #premise.out { opacity: 0; }
  #premise .pm-in { max-width: 600px; padding: 0 28px; text-align: center; line-height: 1.55; animation: pmIn 1.1s ease-out both; }
  #premise small { letter-spacing: .32em; text-transform: uppercase; font-size: 12px; color: #d9b45a; } #premise h2 { font-size: 2em; margin: 10px 0 16px; letter-spacing: .02em; font-weight: 600; }
  #premise p { margin: 0 0 12px; font-size: 1.05em; color: #e8dcc4; } #premise b { color: #fff3d6; } #premise .pm-hint { margin-top: 18px; color: #d9b45a; font-style: italic; }
  @keyframes pmIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  #narrator { position: absolute; left: 50%; right: auto; bottom: 26px; transform: translateX(calc(-50% - var(--panel) / 2)); z-index: 4; width: min(640px, calc(100% - var(--panel) - 60px)); pointer-events: none; opacity: 0; transition: opacity .35s, transform .35s; }
  #narrator.on { opacity: 1; }
  #narrator .nr-line { background: #f2e9d8f2; border-radius: 6px; padding: 12px 18px 12px 20px; box-shadow: 0 10px 30px #0004, inset 0 0 0 1px #00000014; font-size: 15px; line-height: 1.45; position: relative; animation: nrIn .4s ease-out; }
  #narrator .nr-line::before { content: ''; position: absolute; left: 8px; top: 14px; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
  #narrator .mono { font-family: ui-monospace, Menlo, monospace; font-size: .9em; background: #2a201610; padding: 1px 4px; border-radius: 3px; }
  @keyframes nrIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (max-width: 820px) { #premise { right: 0; } #narrator { transform: translateX(-50%); width: calc(100% - 30px); } }
  #opening { position: absolute; inset: 0; right: var(--panel); display: grid; place-content: center; gap: 22px; background: radial-gradient(ellipse at center, #f2e9d8f2, #e6d8bdf5); z-index: 5; transition: opacity .4s; text-align: center; }
  #opening.out { opacity: 0; } #opening[hidden] { display: none; }
  #opening .op-title small { display: block; letter-spacing: .3em; text-transform: uppercase; font-size: 13px; color: var(--muted); } #opening .op-title b { font-size: 2.2em; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
  #opening .op-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 190px)); gap: 16px; }
  #opening figure { margin: 0; padding: 12px; background: #fffaf099; border-radius: 4px; opacity: .45; transform: scale(.96); transition: opacity .3s, transform .3s; }
  #opening figure.now { opacity: 1; transform: none; box-shadow: 0 8px 26px #0002; }
  #opening img { width: 96px; height: 140px; object-fit: cover; border-radius: 4px; } #opening figcaption b { display: block; margin: 6px auto 6px; padding-bottom: 4px; width: fit-content; border-bottom: 1px solid var(--c); } #opening q { font-style: italic; font-size: 13px; line-height: 1.35; }
  #opening .op-skip { justify-self: center; }
  @media (max-width: 820px) { #opening .op-cards { grid-template-columns: repeat(2, minmax(0, 170px)); } #opening { right: 0; } }
  dialog#ladder { width: min(760px, 94vw); max-height: 88vh; border: 0; border-radius: 6px; padding: 22px 26px; background: #f2e9d8 url(art/paper-grain.webp); color: var(--ink); box-shadow: 0 20px 60px #0007; }
  dialog#ladder::backdrop { background: #1c140c88; backdrop-filter: blur(2px); }
  #ladder h2 { margin: 0 0 6px; font-size: 1.5em; letter-spacing: .04em; } #ladder h3 { margin: 18px 0 6px; font-size: 1.05em; border-bottom: 1px solid var(--line); padding-bottom: 4px; } #ladder h4 { margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  #ladder .lede { margin: 0 0 12px; line-height: 1.45; } #ladder .muted { color: var(--muted); }
  #ladder .close { position: absolute; right: 14px; top: 12px; } #ladder .close button { border: 0; font-size: 1.2em; }
  #ladder .houses { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border: 0; padding: 0; margin: 0 0 10px; }
  #ladder .houses label { display: flex; gap: 8px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 13px; line-height: 1.2; }
  #ladder .houses label:has(input:checked) { border-color: var(--c); box-shadow: inset 0 0 0 2px var(--c); background: #fff6; }
  #ladder .houses input { position: absolute; opacity: 0; } #ladder .houses img { width: 30px; height: 44px; object-fit: cover; border-radius: 3px; }
  #ladder .houses label:has(input:focus-visible) { outline: 2px solid var(--ink); }
  #ladder textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border: 1px solid #b9a988; border-radius: 3px; background: #fffaf0; resize: vertical; }
  #ladder .row { display: flex; gap: 10px; align-items: center; margin-top: 8px; } #ladder .row input { flex: 1; font: inherit; padding: 4px 8px; border: 1px solid #b9a988; border-radius: 3px; background: #fffaf0; }
  #ladder #ld-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; } #ladder button[type=submit] { background: var(--ink); color: var(--paper); } #ladder button:disabled { opacity: .5; cursor: default; }
  #ladder ol { margin: 4px 0 0; padding-left: 22px; } #ladder li { margin: 4px 0; } #ladder li > b::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; } #ladder q { font-style: italic; }
  #ladder .ld-head a { margin-left: 8px; color: var(--ink); }
  @media (max-width: 620px) { #ladder .houses { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>HARKARA</h1>
  <select id="battle" aria-label="Battle"></select>
  <span role="group" aria-label="View" id="views"></span>
  <button id="play" aria-pressed="false">Pause</button>
  <span role="group" aria-label="Speed" id="speeds"></span>
  <span id="clock">Watch 1/30</span>
  <span>Belief view:</span><span role="group" aria-label="Belief view" id="beliefs"></span>
  <button id="ladder-open" class="push">Doctrine Ladder</button>
</header>
<main id="stage"><canvas id="c"></canvas><span id="belief-err"></span></main>
<aside><div id="houses"></div><div id="predict" class="item"></div><div role="group" aria-label="Panel" id="tabs"></div><div id="feed" aria-live="off"></div><div id="mail" hidden></div></aside>
<footer>
  <div class="row"><button id="prev" title="Previous mark" aria-label="Previous mark">◀</button><div class="track"><div id="marks"></div><input id="scrub" type="range" min="0" value="0" aria-label="Timeline" /></div><button id="next" title="Next big moment" aria-label="Next big moment">▶</button><button id="copy">Copy link to this moment</button></div>
  <div class="legend">Marks: <b style="color:#c0392b">interception</b> · <b style="color:#2e3550">readable decode</b> · <b style="color:#4e7a5a">truce</b> · <b style="color:#888">rout</b>. Belief view: ghosts show where a general thinks units are. Click a rider to ride with it.</div>
</footer>
<script type="module" src="./main.ts"></script>
</body>
</html>

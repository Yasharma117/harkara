<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harkara · grey box</title>
<style>
  :root { --paper: #f2e9d8; --ink: #1e1c1a; --muted: #6b6459; --line: #d9cdb5; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template: auto 1fr auto / 1fr 380px; background: var(--paper); color: var(--ink); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
  header { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .08em; }
  button, select { font: inherit; background: #fff8ec; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--ink); }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #clock { font-variant-numeric: tabular-nums; min-width: 110px; font-weight: 600; }
  #belief-err { position: absolute; top: 12px; left: 12px; z-index: 2; background: #fff8ecd9; border-radius: 6px; padding: 4px 10px; color: var(--ink); pointer-events: none; }
  #belief-err:empty { display: none; }
  main { position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  aside { grid-row: 2 / 4; grid-column: 2; border-left: 1px solid var(--line); overflow-y: auto; padding: 8px 12px; }
  .house { display: flex; gap: 8px; align-items: baseline; margin: 2px 0; }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .item { padding: 4px 8px 4px 22px; margin: 6px 0; background: #fff8ec; border-radius: 6px; position: relative; }
  .item::before { content: ''; position: absolute; left: 8px; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--c, #999); }
  .item small { color: var(--muted); }
  .item.big { background: #fff; box-shadow: 0 0 0 1px var(--line); }
  .mono { font-family: ui-monospace, Menlo, monospace; letter-spacing: .04em; }
  footer { position: relative; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
  .row { display: flex; gap: 8px; align-items: center; }
  .track { flex: 1; }
  #prev, #next { font-size: 16px; line-height: 1; padding: 4px 9px; }
  #scrub { width: 100%; }
  #tabs { margin: 8px 0 4px; display: flex; gap: 6px; }
  .card { cursor: pointer; }
  .card[aria-current="true"] { box-shadow: 0 0 0 2px var(--ink); }
  .fate { font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; }
  #marks { position: relative; height: 10px; margin: 0 7px; }
  #marks i { position: absolute; top: 0; width: 3px; height: 10px; border-radius: 1px; cursor: pointer; }
  .legend { color: var(--muted); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>HARKARA</h1>
  <select id="battle" aria-label="Battle"></select>
  <span role="group" aria-label="View" id="views"></span>
  <button id="play" aria-pressed="false">Pause</button>
  <span role="group" aria-label="Speed" id="speeds"></span>
  <span id="clock">Watch 1/30</span>
  <span>Belief view:</span><span role="group" aria-label="Belief view" id="beliefs"></span>
</header>
<main id="stage"><canvas id="c"></canvas><span id="belief-err"></span></main>
<aside><div id="houses"></div><div role="group" aria-label="Panel" id="tabs"></div><div id="feed" aria-live="off"></div><div id="mail" hidden></div></aside>
<footer>
  <div class="row"><button id="prev" title="Previous mark" aria-label="Previous mark">◀</button><div class="track"><div id="marks"></div><input id="scrub" type="range" min="0" value="0" aria-label="Timeline" /></div><button id="next" title="Next big moment" aria-label="Next big moment">▶</button><button id="copy">Copy link to this moment</button></div>
  <div class="legend">Marks: <b style="color:#c0392b">interception</b> · <b style="color:#2e3550">readable decode</b> · <b style="color:#4e7a5a">truce</b> · <b style="color:#888">rout</b>. Belief view: ghosts are where that general thinks units are; the dotted line points to the truth. In the diorama, click a rider to ride with it; the director takes the camera back after 20 s.</div>
</footer>
<script type="module" src="./main.ts"></script>
</body>
</html>

#cloud-config
# Paste this whole file into "Show advanced options → Management → cloud-init script" when creating the A1 instance.
# Then, once it's up, open the browser terminal (Cloud Shell or the instance console) and run:  harkara-setup
package_update: true
packages: [git, curl, ca-certificates, build-essential, cmake, caddy, ffmpeg, iptables-persistent]
runcmd:
  - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
  - apt-get install -y nodejs
  # local ladder model: llama.cpp built for this CPU, Gemma 4 E4B (Q4_0, ~3 GB). Same model for every house in a ladder battle.
  - git clone -q --depth 1 https://github.com/ggml-org/llama.cpp /opt/llama.cpp
  - cmake -S /opt/llama.cpp -B /opt/llama.cpp/build -DGGML_NATIVE=ON -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
  - cmake --build /opt/llama.cpp/build --target llama-server -j 2
  - mkdir -p /opt/models && curl -fsSL -o /opt/models/ladder.gguf https://huggingface.co/ggml-org/gemma-4-E4B-it-GGUF/resolve/main/gemma-4-E4B-it-Q4_0.gguf
  # Oracle's Ubuntu image blocks everything but SSH in iptables; open the web ports for Caddy (also add them to the VCN security list)
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - netfilter-persistent save
  - systemctl daemon-reload
  - systemctl enable --now harkara-llm
write_files:
  - path: /usr/local/bin/harkara-setup
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Asks for the GitHub token and model keys, clones the repo, checks every model, arms the nightly timer.
      # Keys go into ~/harkara/.env (mode 600) and nowhere else.
      set -euo pipefail
      [ "$(id -un)" = ubuntu ] || { echo "run as the ubuntu user"; exit 1; }
      cd ~
      read -rsp "GitHub fine-grained token (repo Yasharma117/harkara, Contents: read and write): " GH; echo
      umask 077
      printf 'https://x-access-token:%s@github.com\n' "$GH" > ~/.git-credentials
      git config --global credential.helper store
      git config --global user.name harkara-runner
      git config --global user.email runner@harkara.invalid
      [ -d harkara ] || git clone -q https://github.com/Yasharma117/harkara.git
      cd harkara
      : > .env
      for k in GROQ_API_KEY NVIDIA_API_KEY OPENROUTER_API_KEY; do
        read -rsp "$k (Enter to skip): " v; echo
        [ -n "$v" ] && echo "$k=$v" >> .env
      done
      # the ladder API's visitor hashes need a salt that survives restarts (one entry per visitor per day)
      grep -q '^LADDER_SALT=' .env 2>/dev/null || echo "LADDER_SALT=$(openssl rand -hex 16)" >> .env
      read -rp "Site address for the ladder API's CORS, e.g. https://harkara.pages.dev (Enter for any): " ORIGIN
      [ -n "$ORIGIN" ] && echo "ALLOW_ORIGIN=$ORIGIN" >> .env
      umask 022
      # HTTPS for the ladder API with no domain to buy: <ip>.sslip.io resolves to this box, and Caddy gets a certificate for it
      HOST="$(curl -fsS https://ifconfig.me | tr . -).sslip.io"
      printf '%s {\n  reverse_proxy /api/* 127.0.0.1:8787\n}\n' "$HOST" | sudo tee /etc/caddy/Caddyfile >/dev/null
      sudo systemctl enable --now harkara-api && sudo systemctl reload caddy
      echo; echo "Ladder API: https://$HOST/api/ladder  (set VITE_LADDER_API=https://$HOST in Cloudflare Pages, then redeploy)"
      echo; echo "Checking every model in engine/providers.json:"
      node --env-file=.env engine/check.ts || true
      sudo systemctl enable --now harkara-battle.timer
      echo; echo "Done. First battle runs tonight at 02:00 IST. Run one now with: ~/harkara/deploy/nightly.sh"
  - path: /etc/systemd/system/harkara-llm.service
    content: |
      [Unit]
      Description=Harkara local ladder model (llama.cpp, OpenAI-compatible on 127.0.0.1:8080)
      After=network-online.target
      [Service]
      ExecStart=/opt/llama.cpp/build/bin/llama-server -m /opt/models/ladder.gguf --host 127.0.0.1 --port 8080 -c 8192 --jinja --reasoning off -t 2
      Restart=always
      RestartSec=10
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/harkara-api.service
    content: |
      [Unit]
      Description=Harkara Doctrine Ladder API (127.0.0.1:8787, behind Caddy)
      After=network-online.target
      [Service]
      User=ubuntu
      WorkingDirectory=/home/ubuntu/harkara
      EnvironmentFile=/home/ubuntu/harkara/.env
      ExecStart=/usr/bin/node server/ladder.ts
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/harkara-battle.service
    content: |
      [Unit]
      Description=Harkara nightly battle
      After=network-online.target
      Wants=network-online.target
      StartLimitIntervalSec=1d
      StartLimitBurst=12
      [Service]
      Type=oneshot
      User=ubuntu
      ExecStart=/home/ubuntu/harkara/deploy/nightly.sh
      Restart=on-failure
      RestartSec=30min
      TimeoutStartSec=8h
  - path: /etc/systemd/system/harkara-battle.timer
    content: |
      [Unit]
      Description=Harkara nightly battle, 02:00 IST
      [Timer]
      OnCalendar=*-*-* 20:30:00 UTC
      Persistent=true
      [Install]
      WantedBy=timers.target
